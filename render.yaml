# Render Blueprint — one web service serves both the API and the Arabic frontend.
# Render dashboard → New → Blueprint → select this repository.
services:
  - type: web
    name: beati
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: OPENAI_API_KEY
        sync: false        # GitHub token (Models: Read) or OpenAI key — entered in the dashboard, never in git
      # Free option: GitHub Models. For paid OpenAI, delete OPENAI_BASE_URL and use gpt-4o.
      - key: OPENAI_BASE_URL
        value: https://models.github.ai/inference
      - key: OPENAI_MODEL
        value: openai/gpt-4o
      - key: OPENAI_CHAT_MODEL
        value: openai/gpt-4o-mini
      - key: DEMO_MODE
        value: "false"
      - key: MAX_UPLOAD_MB
        value: "8"
      - key: RATE_LIMIT_REQUESTS
        value: "20"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "600"
