# Render Blueprint — one web service serves both the API and the Arabic frontend.
# Render dashboard → New → Blueprint → select this repository.
services:
  - type: web
    name: beati
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: OPENAI_API_KEY
        sync: false        # you enter the secret in the Render dashboard; never in git
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: DEMO_MODE
        value: "false"
      - key: MAX_UPLOAD_MB
        value: "8"
      - key: RATE_LIMIT_REQUESTS
        value: "20"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "600"
